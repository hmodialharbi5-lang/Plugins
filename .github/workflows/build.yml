name: Build InfiniteMinions

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Show build output
        run: |
          echo "Built DLLs:"
          find . -type f -path '*/bin/Release/*' -name '*.dll' -print

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteMinions
          path: '**/bin/Release/**/InfiniteMinions.dll'
          if-no-files-found: error
