name: Build InfiniteMinions

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore InfiniteMinions.csproj

      - name: Build
        run: dotnet build InfiniteMinions.csproj --configuration Release --no-restore

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteMinions
          path: InfiniteMinions/bin/Release/net9.0/InfiniteMinions.dll
          if-no-files-found: error
