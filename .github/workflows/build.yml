name: Build InfiniteMinions Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Check for required DLLs
        run: |
          echo "Checking lib folder..."
          ls -la lib/
          if [ ! -f lib/TShockAPI.dll ]; then
            echo "ERROR: lib/TShockAPI.dll is missing!"
            echo "Please put the real TShock DLLs in the lib/ folder and commit them."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteMinions
          path: bin/Release/net9.0/InfiniteMinions.dll
          if-no-files-found: error
